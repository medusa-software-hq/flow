syntax = "proto3";

package medusa.session.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "software.medusa.flow.v1";

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_PENDING = 1;
  SESSION_STATE_RUNNING = 2;
  SESSION_STATE_COMPLETED = 3;
  SESSION_STATE_FAILED = 4;
  // Terminated on purpose by a human (AbortSession) while it was running — not an
  // engine failure. Terminal like COMPLETED/FAILED: no further worker writes apply.
  SESSION_STATE_ABORTED = 5;
}

// The control plane's verdict on a worker's write to its session, returned on the
// worker-write RPCs. ACCEPTED is the normal case. ABORTED is *not* an error and not
// the worker's fault: the session was aborted out from under it, so this is its cue
// to stop and kill the engine. Distinguishing this from a gRPC error is deliberate —
// the worker did nothing wrong, so abort is modeled as an expected outcome, not a
// FAILED_PRECONDITION.
enum SessionWriteAck {
  SESSION_WRITE_ACK_UNSPECIFIED = 0;
  SESSION_WRITE_ACK_ACCEPTED = 1;
  SESSION_WRITE_ACK_ABORTED = 2;
}

// The agentic engine that runs a session (M4). UNSPECIFIED = "the claiming
// worker's default" (builtin, unless the worker overrides it). Workers are
// uniform — every worker can run every engine — so any worker may claim any
// session regardless of its engine.
enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_BUILTIN = 1;
  ENGINE_CLAUDE = 2;
  // The leader/assistant engine (M3). Intended over time to become the primary
  // engine, superseding reliance on ENGINE_CLAUDE, with ENGINE_BUILTIN kept as
  // the always-available fallback.
  ENGINE_LEADER = 3;
}

message Session {
  string id = 1;
  string repo_full_name = 2;
  string task_markdown = 3;
  SessionState state = 4;
  google.protobuf.Timestamp created_at = 5;
  string created_by = 6;
  // Set when COMPLETED.
  string pr_url = 7;
  // Set when FAILED. Human-readable Markdown.
  string failure_summary = 8;
  // Issue linkage (M2). Set only for sessions the reconciler created for an
  // issue pipeline; empty/zero for manual sessions.
  int32 issue_number = 9;
  string issue_url = 10;
  string issue_pipeline_id = 11;
  // Requested engine (M4). UNSPECIFIED = the claiming worker's default.
  Engine engine = 12;
  // Display-only terminal cost in USD (M4 claude engine). Present once the run's
  // RUN_COST event has landed; absent (no presence) while unknown / for engines
  // that don't report cost. Powers the sessions-list cost column.
  optional double total_cost_usd = 13;
  // The job this session belongs to (M6). Sessions sharing a job_id are claimed
  // and run together by one worker; a reconciled issue's Claude + built-in
  // sessions share one.
  string job_id = 14;
  // How many times this session has been requeued after a worker-death (crash,
  // node failure, or a drain that exceeded its deadline) — 0 means it has never
  // been requeued. Display-only; the bound is enforced server-side.
  int32 attempt_count = 15;
}

enum SessionEventKind {
  SESSION_EVENT_KIND_UNSPECIFIED = 0;
  SESSION_EVENT_KIND_WORKSPACE_PREPARING = 1; // clone + manifest load + physical workspace
  SESSION_EVENT_KIND_HEALTH_GATE = 2; // initial bootstrap/analyze/test
  SESSION_EVENT_KIND_SCOUTING_ROUND = 3;
  SESSION_EVENT_KIND_WORKSPACE_BRIEFING = 4;
  SESSION_EVENT_KIND_IMPLEMENTATION_PLANNING = 5;
  SESSION_EVENT_KIND_IMPLEMENTATION_ATTEMPT = 6;
  SESSION_EVENT_KIND_HEALTH_CHECK = 7; // per-attempt analyze/test result
  SESSION_EVENT_KIND_PUBLISHING = 8; // branch/commit/push/PR
  // M4 (Claude engine): live agent narrative / tool actions, the opening engine
  // banner (CLI version + model + run mode), and the terminal cost/usage.
  SESSION_EVENT_KIND_AGENT_ACTION = 9;
  SESSION_EVENT_KIND_ENGINE_BANNER = 10;
  SESSION_EVENT_KIND_RUN_COST = 11;
}

message SessionEvent {
  int32 seq = 1;
  google.protobuf.Timestamp created_at = 2;
  SessionEventKind kind = 3;
  // Short human-readable Markdown, control-plane-capped (e.g. 4 KiB).
  string message = 4;
}

// User-facing service, authenticated with a Google user ID token.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Human "stop": transition a RUNNING session to ABORTED. The worker holding it
  // learns via the ABORTED write-ack on its next heartbeat/event and kills the
  // engine. A no-op-ish FAILED_PRECONDITION if the session isn't RUNNING.
  rpc AbortSession(AbortSessionRequest) returns (AbortSessionResponse);
}

message AbortSessionRequest {
  string id = 1;
}

message AbortSessionResponse {
  Session session = 1;
}

message CreateSessionRequest {
  string repo_full_name = 1;
  string task_markdown = 2;
  // Optional (M4). UNSPECIFIED → the claiming worker's default engine.
  Engine engine = 3;
}

message CreateSessionResponse {
  Session session = 1;
}

// Newest-first, fixed limit.
message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string id = 1;
  // Events with seq > after_seq; lets the detail view poll incrementally.
  int32 after_seq = 2;
}

message GetSessionResponse {
  Session session = 1;
  repeated SessionEvent events = 2;
}

// Worker-facing service, authenticated with a service-account ID token
// against an email allowlist.
service WorkerService {
  // Atomically claims the oldest PENDING session (SKIP LOCKED); absent session if none.
  // Deprecated by ClaimNextJob (kept for rollout compatibility with older workers).
  rpc ClaimNextSession(ClaimNextSessionRequest) returns (ClaimNextSessionResponse);
  // Atomically claims the oldest PENDING *job* — all sessions sharing that job's
  // id (a reconciled issue's Claude + built-in) — so one worker runs both engines
  // in parallel. Empty sessions list means the queue is empty.
  rpc ClaimNextJob(ClaimNextJobRequest) returns (ClaimNextJobResponse);
  // Appends a display event; also bumps the heartbeat.
  rpc AppendSessionEvent(AppendSessionEventRequest) returns (AppendSessionEventResponse);
  // Bare heartbeat for long silent phases.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CompleteSession(CompleteSessionRequest) returns (CompleteSessionResponse);
  // Normally transitions a RUNNING session straight to FAILED. When
  // `worker_death` is set and the session hasn't exhausted its bounded
  // worker-death retry budget, it is requeued to PENDING instead — a fresh
  // attempt rather than lost work.
  rpc FailSession(FailSessionRequest) returns (FailSessionResponse);

  // Worker fleet liveness + version surfacing (M5). A worker registers itself
  // periodically — independent of whether it is currently running a session —
  // so the control plane always knows which workers are alive and what build
  // each runs. The system-test promotion gate reads this to (a) fail fast with a
  // distinct "staging worker down" when no worker is live, rather than a generic
  // test timeout, and (b) print the worker version/digest it tested against, so
  // version skew is a printed fact rather than a silent gap (story 04).
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  // Lists the known workers and their last-seen registration. Worker-authorized
  // (the same SA allowlist the other WorkerService methods use), so the
  // system-test suite reads it with the worker-SA identity it already holds.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
}

message RegisterWorkerRequest {
  // Stable identity for this worker process/host. The control plane upserts on
  // this key, so repeated registrations refresh a single row's last-seen rather
  // than accumulating rows.
  string worker_id = 1;
  // Human-readable build version. Story 01 sends best-effort (may be empty);
  // story 04 wires the real build-stamped value.
  string worker_version = 2;
  // Container image digest when the worker runs containerized; empty otherwise.
  string image_digest = 3;
  // Field 4 was `supported_engines`, removed when workers became uniform (every
  // worker runs every engine, so capability is no longer advertised).
  reserved 4;
  reserved "supported_engines";
}

message RegisterWorkerResponse {}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message WorkerInfo {
  string worker_id = 1;
  string worker_version = 2;
  string image_digest = 3;
  // Field 4 was `supported_engines`, removed when workers became uniform.
  reserved 4;
  reserved "supported_engines";
  // When the control plane last received a registration from this worker.
  google.protobuf.Timestamp last_seen_at = 5;
  // When the control plane first saw this worker.
  google.protobuf.Timestamp first_seen_at = 6;
}

message ClaimNextSessionRequest {
  // Field 1 was `supported_engines`, removed when workers became uniform: every
  // worker runs every engine, so a claim is unconditional (oldest pending
  // session wins).
  reserved 1;
  reserved "supported_engines";
}

// Absent session means the queue is empty.
message ClaimNextSessionResponse {
  Session session = 1;
}

message ClaimNextJobRequest {}

// The claimed job's sessions (already RUNNING), in a stable order (primary
// first). Empty means the queue is empty.
message ClaimNextJobResponse {
  repeated Session sessions = 1;
}

message AppendSessionEventRequest {
  string session_id = 1;
  SessionEventKind kind = 2;
  string message = 3;
  // Set only on a RUN_COST event (M4): the run's terminal USD cost, persisted onto
  // the session row so the sessions list can show it without loading events.
  optional double cost_usd = 4;
}

message AppendSessionEventResponse {
  // ACCEPTED normally; ABORTED tells the worker its session was aborted (stop).
  SessionWriteAck ack = 1;
}

message HeartbeatRequest {
  string session_id = 1;
}

message HeartbeatResponse {
  // ACCEPTED normally; ABORTED tells the worker its session was aborted (stop).
  // The heartbeat is the guaranteed ≤interval signal even during long silent phases.
  SessionWriteAck ack = 1;
}

message CompleteSessionRequest {
  string session_id = 1;
  string pr_url = 2;
}

message CompleteSessionResponse {}

message FailSessionRequest {
  string session_id = 1;
  // Markdown.
  string failure_summary = 2;
  // Set when the worker itself is the thing that died (a drain exceeding its
  // deadline) rather than the engine/task genuinely failing. Distinguishes the
  // two so only worker-death requeues the session for a fresh attempt (bounded
  // retry) instead of terminating it FAILED — see FailSession's doc.
  bool worker_death = 3;
}

message FailSessionResponse {}
