package-manager: yarn

bootstrap:
  steps:
    - name: generate-proto
      command: buf
      args: [generate]

normalize:
  steps:
    - name: format
      command: oxfmt
      args: ["--write", "**/*.{ts,tsx,css}"]

analyze:
  steps:
    - name: format
      command: oxfmt
      args: ["--check", "**/*.{ts,tsx,css}"]
    - name: oxlint
      command: oxlint
      args: ["."]
    - name: stylelint
      command: stylelint
      args: ["**/*.css", "--cache"]
    - name: typecheck
      command: tsc
      args: ["--noEmit"]
    - name: build
      command: vite
      args: [build]

test:
  steps:
    - name: unit
      command: vitest
      args: [run]
