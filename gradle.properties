# JIB doesn't support configuration cache
org.gradle.configuration-cache=false

# Cap internal worker fan-out so two concurrent builds on a 12-core worker
# don't oversubscribe to 24 workers and starve GC (see GC-overhead OOM during
# concurrent testClasses). Complements the toolchain semaphore, which bounds
# how many builds run at once.
org.gradle.workers.max=4
