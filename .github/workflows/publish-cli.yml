name: Publish CLI

on:
  push:
    branches:
      - trunk/*

    paths:
      - cli/**
      - engine/**
      - worker/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties

  workflow_dispatch: {}

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  publish-cli:
    name: Publish CLI fat jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-java@v5.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build fat jar
        run: |
          ./gradlew :cli:shadowJar
          echo "JAR=$GITHUB_WORKSPACE/cli/build/libs/flow-cli.jar" >> $GITHUB_ENV
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.GH_RELEASES_APP_PEM_CONTENT }}
          owner: medusa-software-hq
          repositories: flow-releases,homebrew-tap

      - name: Create a release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" \
            --repo medusa-software-hq/flow-releases \
            --title "Flow CLI ${VERSION}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            "${JAR}"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Update Homebrew formula
        working-directory: cli/tools/update-formula
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run update_formula.py --version "${VERSION}" --jar "${JAR}"

  # M4 Path B / B4 — the hosted-worker container image (worker/Dockerfile). Env-agnostic (no baked
  # config; identity/env/secrets all arrive at spawn), so one image serves every environment; the
  # ms-workload profile pins it by digest. Published to staging's Artifact Registry — that's where
  # the first hosted worker (B5) lives; a prod copy rides B7.
  publish-worker-image:
    name: Publish worker image
    runs-on: ubuntu-latest

    # `environment: staging` resolves vars.* (registry endpoint/host, CI/CD identity) to staging.
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-java@v5.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build the worker fat jar
        run: ./gradlew :cli:shadowJar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_AR_REPO_HOSTNAME }} --quiet

      # Multi-arch (amd64 + arm64) so the same digest runs on x86 hosts and Apple-Silicon / ARM
      # hardware without emulation — the base image and the fat jar are both arch-portable. QEMU
      # cross-builds the arm64 variant on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the multi-arch worker image
        id: build
        run: |
          image="${{ vars.GCP_AR_REPO_ENDPOINT }}/worker"
          ctx="$RUNNER_TEMP/worker-ctx"
          mkdir -p "$ctx"
          cp cli/build/libs/flow-cli.jar "$ctx/flow-cli.jar"
          cp worker/Dockerfile "$ctx/Dockerfile"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$image:${{ github.sha }}" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --push \
            "$ctx"
          # The manifest-list digest — what the ms-workload profile pins; the daemon picks the arch.
          digest="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Flow worker image (multi-arch: amd64 + arm64)'
            echo ''
            echo "- Ref: \`$image:${{ github.sha }}\`"
            echo "- Digest: \`$digest\`  ← pin this in the ms-workload profile (manifest list; the daemon selects the arch)"
          } >> "$GITHUB_STEP_SUMMARY"
