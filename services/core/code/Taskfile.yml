version: '3'

# noinspection YAMLSchemaValidation
.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

tasks:
  checkFormatting:
    desc: Check Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtCheck
    interactive: true

  fixFormatting:
    desc: Fix Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtFormat
    interactive: true

  lint:
    desc: Lint the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ./gradlew detekt
    interactive: true

  compile:
    desc: Compile the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ./gradlew compileKotlin
    interactive: true

  run:
    desc: Run the service locally
    requires:
      vars:
        - PORT
        - WORKING_DIRECTORY_PATH
    env:
      PORT: '{{.PORT}}'
      CORS_ALLOWED_ORIGIN_REGEX: "http://localhost(:\\d+)?"
      WORKING_DIRECTORY_PATH: "{{.WORKING_DIRECTORY_PATH}}"
    cmds:
      - ./gradlew :local:run
    interactive: true
